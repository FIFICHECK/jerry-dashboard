<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jerry Dashboard</title>
<style>
    #dashFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; z-index: 1; background: #fff; }
</style>
</head>
<body>
<div id="access-gate-overlay" style="position:fixed;inset:0;background:#faf7f5;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">
  <div style="background:#fff;border:1px solid #e8ddd5;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.08);max-width:420px;width:100%;padding:36px 32px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">🔐</div>
    <h2 style="margin:0 0 10px;font-size:1.25rem;">受保護的 Dashboard</h2>
    <p style="color:#8a857e;font-size:.9rem;margin:0 0 20px;line-height:1.6;">此 Dashboard 只供獲授權人士查閱。<br>請輸入你的 email 申請訪問。</p>
    <input type="email" id="access-email" placeholder="你的 email" autocomplete="email" style="width:100%;padding:11px 14px;border:1px solid #e8ddd5;border-radius:8px;font-size:1rem;box-sizing:border-box;margin-bottom:12px;color:#2f2f2f;">
    <input type="text" id="access-reason" placeholder="申請原因（例：需查閱數據）" maxlength="200" style="width:100%;padding:11px 14px;border:1px solid #e8ddd5;border-radius:8px;font-size:1rem;box-sizing:border-box;margin-bottom:12px;color:#2f2f2f;">
    <input type="text" id="access-purpose" placeholder="用途（例：日常分析）" maxlength="200" style="width:100%;padding:11px 14px;border:1px solid #e8ddd5;border-radius:8px;font-size:1rem;box-sizing:border-box;margin-bottom:12px;color:#2f2f2f;">
    <button id="access-submit" style="width:100%;padding:11px 14px;border:none;border-radius:8px;background:#c76b6b;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;">申請訪問</button>
    <p id="access-gate-msg" style="margin-top:14px;font-size:.9rem;min-height:1.2em;"></p>
  </div>
</div>
    <iframe id="dashFrame" title="Jerry Dashboard"></iframe>
    <script>
    // 🔐 Access gate loader (B pilot 2026-08-29): gate → session → iframe（dashboard 由 worker auth serve）
    const ALLOWLIST_URL = 'data/access_allowlist.json';
    const GATE_ADMIN_EMAIL = 'amVycnlAaGt0di5jb20uaGs=';
    const GATE_STORE = 'jerry-dashboard';
    const DASH_URL = 'https://fificheck-access-gate.fificheck.workers.dev/data?site=jerry-dashboard&path=index.html';

    function decodeAdminEmail() {
      try { return atob(GATE_ADMIN_EMAIL); } catch(e) { return ''; }
    }

    async function enterDash(email) {
      const status = document.getElementById('access-gate-msg');
      try {
        const r = await fetch('https://fificheck-access-gate.fificheck.workers.dev/session', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ site: GATE_STORE, email: email }),
          credentials: 'include'
        });
        if (!r.ok) { if (status) status.textContent = '⚠️ 未授權或 session 過期，請重新申請'; return; }
      } catch (e) { if (status) status.textContent = '⚠️ 連線失敗，請稍後再試'; return; }
      const f = document.getElementById('dashFrame');
      f.src = DASH_URL + '&v=' + Date.now() + '&email=' + encodeURIComponent(email);
      f.style.display = 'block';
    }

    function initAccessGate() {
      const gate = document.getElementById('access-gate-overlay');
      const status = document.getElementById('access-gate-msg');
      if (!gate) return;
      const submitBtn = document.getElementById('access-submit');
      if (submitBtn) submitBtn.addEventListener('click', submitAccessRequest);
      const input = document.getElementById('access-email');
      if (input) input.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') submitAccessRequest(); });
      const saved = localStorage.getItem('jerry-access-email');
      fetch(ALLOWLIST_URL + '?v=' + Date.now())
        .then(function(r) { return r.ok ? r.json() : []; })
        .then(function(lst) {
          const norm = (lst || []).map(String).map(function(s) { return s.trim().toLowerCase(); });
          if (saved && norm.indexOf(saved.toLowerCase()) >= 0) {
            gate.style.display = 'none';
            enterDash(saved);
            return;
          }
          gate.style.display = 'flex';
        })
        .catch(function() { gate.style.display = 'flex'; });
    }

    function submitAccessRequest() {
      const input = document.getElementById('access-email');
      const status = document.getElementById('access-gate-msg');
      if (!input || !status) return;
      const email = (input.value || '').trim().toLowerCase();
      if (email.indexOf('@') < 1) { status.textContent = '⚠️ 請輸入有效 email'; return; }
      status.textContent = '⏳ 送出申請中…';
      fetch('https://fificheck-access-gate.fificheck.workers.dev/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ site: GATE_STORE, email: email, reason: (document.getElementById('access-reason').value || '').trim(), purpose: (document.getElementById('access-purpose').value || '').trim() })
      }).then(function() {
        try { localStorage.setItem('jerry-access-email', email); } catch(e) {}
        status.textContent = '✅ 已送出申請！管理員一撳批准，你重新整理此頁即可進入。';
      }).catch(function() {
        status.textContent = '❌ 送出失敗 — 請直接 email ' + decodeAdminEmail();
      });
    }
    initAccessGate();
    </script>
</body>
</html>
